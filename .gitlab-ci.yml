stages:
  - test
  - health-check

test-runner:
  stage: test
  script:
    - echo "========== TESTING RUNNER =========="
    - echo "Runner successfully started!"
    - echo "Creating build directory and files..."
    - mkdir build
    - 'echo "Build version 1.0" > build/version.txt'
    - 'echo "Build timestamp: %date% %time%" >> build/timestamp.txt'
    - echo "File list:"
    - dir
    - echo "========== TEST COMPLETED =========="
  artifacts:
    paths:
      - build/
    expire_in: 1 week
    name: "build-${CI_COMMIT_SHORT_SHA}"

health-check:
  stage: health-check
  script:
    - echo "========== HEALTH CHECK =========="
    - echo "Checking if service is working"
    - echo "You can add curl request to /health endpoint"
    - echo "curl http://localhost:8000/health"
    - echo "========== CHECK COMPLETED =========="