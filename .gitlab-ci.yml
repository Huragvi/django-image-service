stages:
  - test
  - health-check

test-runner:
  stage: test
  script:
    - echo "========== TESTING RUNNER =========="
    - echo "Runner successfully started!"
    - echo "Current directory: %cd%"
    - echo "File list:"
    - dir
    - echo "========== TEST COMPLETED =========="
  tags:
    - windows
    - local
    - my-runner

health-check:
  stage: health-check
  script:
    - echo "========== HEALTH CHECK =========="
    - echo "Checking if service is working"
    - echo "You can add curl request to /health endpoint"
    - echo "curl http://localhost:8000/health"
    - echo "========== CHECK COMPLETED =========="
  tags:
    - fastapi
    - windows

